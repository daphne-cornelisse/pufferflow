# WOMD train 10k, then the three I24 logs, then four flat CARLA towns.
# Map order:
#   0..9999       WOMD train logs
#   10000..10002  I24 logs
#   10003 Town01, 10004 Town02, 10005 Town06, 10006 Town10HD
# Town03, Town04, Town05, and Town07 have overpasses. This build has
# no 3D roads, so those towns are not in the pool. CARLA has no log:
# each car gets one centerline goal. WOMD and I24 use the logged goal.
# A log copy has one slot per controllable agent: the self-driving car,
# then every other mover that is valid at the start, is not an expert,
# and is at least 5 m from its goal. Each CARLA town copy has 128 cars.
# A copy cannot change its slot count, so it only reloads a scene with
# the same count. The town copies stay up when they already hold that
# town. The window moves after about 15 finished episodes.
# Episodes are at most 600 steps. A shorter log ends at its last frame,
# and the episode also ends once every scored car has arrived.

[base]
env_name = drive
checkpoint_interval = 500
record_rollout_every = 0
record_frames = 200
log_dir = logs/mixed_big
checkpoint_dir = checkpoints/mixed_big

[vec]
total_agents = 8192
num_buffers = 4
num_threads = 8

[env]
selected_agent_idx = 0
map_id = 0
map_offset = 0
data_dir = data/mixed_big
num_maps = 10007
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
reward_goal = 1.0
reward_jerk = 0
target_speed = 0
speed_band = 2
episode_length = 600
# Width when every map is one class. A mixed pool sizes each log from
# its controllable agents and each road map from road_agents.
num_agents = 8
# Cars placed on a road map. 0 keeps num_agents for every map.
road_agents = 128
control_mode = control_agents
max_controlled_agents = 32
goal_distance_min = 5
goal_distance_max = 50
init_steps = 0
goal_radius = 5
goal_speed = 100
goal_stop = 0
# One goal, then the car is removed. CARLA does not sample another.
goal_resample = 0
# Step resampling stays off. Episodes move the map window.
resample_frequency = 0
resample_episodes = 15
wosac_dir = none

# Sweep run 35, score 0.9350. num_layers is an int, so the logged
# 3.344 trained as 3 layers.
[policy]
hidden_size = 256
num_layers = 3

[sweep]
metric = score
metric_distribution = linear
goal = maximize
# Uptime seconds. A suggestion predicted past this is not picked.
# 2e9 steps is a few hours at these widths, so the cap stays above that.
max_suggestion_cost = 28800
max_runs = 1200
use_history = 1

[train]
total_timesteps = 227_350_112
learning_rate = 0.00331095303
gamma = 0.986396253
gae_lambda = 0.85170728
replay_ratio = 1
clip_coef = 0.108105324
vf_coef = 1.92155802
vf_clip_coef = 0.113831967
max_grad_norm = 1.015885
ent_coef = 3.93386144e-05
momentum = 0.983052731
minibatch_size = 8192
horizon = 32
anchor = checkpoints/bc_womd_1000.npz
anchor_coef = 0
anchor_dist = kl

# Overlay on config/default.ini. Hidden 512 and horizon 512 do not fit
# this 16 GB card, so those axes are narrowed here only.
[sweep.train.total_timesteps]
distribution = log_normal
min = 2e8
max = 2e9
scale = time

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 128
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 4
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 40
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 8192
scale = auto

[sweep.train.anchor_coef]
distribution = uniform
min = 0
max = 0.2
scale = auto
