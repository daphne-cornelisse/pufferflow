# Eval protocol. Loaded on top of config/drive.ini by ./drive --eval.
# The trainer keeps drive.ini. This file does not change the sweep.
# Town06 is map_002. One episode of episode_length, no reset between
# the horizon bins. Cars per copy run from agents_min to agents_max.

[env]
map_id = 2
num_maps = 1
episode_length = 2000

[benchmark]
agents_min = 50
agents_max = 500
agents_step = 50
failure_bin = 100
