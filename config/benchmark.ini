# Human-replay on Waymo, then longer Town01 episodes.
# ./drive --benchmark checkpoints/drive/town01_bc1000/0000000578813952.bin
# after_train = 1 runs that command after ./puffer train.
# A sweep does not. Its meta-objective is [sweep] metric in the training
# ini (score is env/score).
# sweep_metric replaces the training score only for that after_train run.
# Empty skips the replacement. score keeps the training score.
# Names: replay_collision, replay_offroad, replay_completion,
# replay_score, replay_ade_lat, replay_ade_lon,
# horizon_collision, horizon_score.
# replay_score is the first goal with no collision or off-road.
# horizon_score is the mean steps before a collision or off-road.

[replay]
# One policy car per scene. Partners stay on the logged trajectory.
scenes = 512
map_start = 0
data_dir = data/womd

[horizon]
# map_000.bin is Town01. map_001.bin is Town02, map_002.bin Town06,
# map_003.bin Town10HD.
data_dir = data/mixed
map_id = 0
agents = 128
horizons = 500
rollouts = 1

[benchmark]
after_train = 0
sweep_metric = score
out_dir = analysis/benchmark
