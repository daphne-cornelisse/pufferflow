[base]
env_name = drive
checkpoint_interval = 1000
record_rollout_every = 0
# Clip length in steps. Training episodes stay at episode_length.
record_frames = 200

[vec]
# 128 cars per copy. 8192 / 128 = 64 copies across 3 maps, so the
# maps get 22, 21, and 21 copies. 8192 is not divisible by 3.
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
selected_agent_idx = 0
# Loaded file is data/mixed/binaries/map_001.bin (Town01).
# map_000.bin is the bottleneck and map_002.bin is Town02.
map_id = 1
data_dir = data/mixed
num_maps = 1
reward_vehicle_collision = -1.25
reward_offroad_collision = -1.25
# Paid on every arrival within 5 m.
reward_goal = 1.0
# Tiny velocity-change penalty: reward_jerk * |Δv| / dt each step.
reward_jerk = -0.0003
# Steps before the episode resets.
episode_length = 300
# Cars placed on one map copy. 128 divides 8192 and each buffer of 4096.
num_agents = 128
# Euclidean goal distance in meters. The point is on the forward
# centerline, in front of the car. 
goal_distance_min = 5
goal_distance_max = 30
# Agent overlap. bump pushes cars apart. through lets them pass.
collision_physics = through

[sweep]
metric = score
metric_distribution = linear
max_suggestion_cost = 1600

[policy]
hidden_size = 512
num_layers = 3

[train]
total_timesteps = 579122816
learning_rate = 0.00255716895
gamma = 0.921840191
gae_lambda = 0.615350962
replay_ratio = 1
clip_coef = 0.186160475
vf_coef = 2.76241016
vf_clip_coef = 1.0689646
max_grad_norm = 0.141963243
ent_coef = 0.00401300658
momentum = 0.969024062
minibatch_size = 16384
horizon = 64
# Spiced self-play. λ = 0.075, KL(anchor || policy) on rollout states.
# Heads must match constants.h: 257 accel bins on [-8, 8] m/s^2 and
# 257 steer bins on [-1.5, 1.5] rad. The center bin is exactly 0.
# move_dynamics steps that table.
# 1000-map Waymo BC anchor. 704 wide, 3 layers, observation width 981.
anchor = checkpoints/bc_womd_1000.npz
anchor_coef = 0.075
# Options: kl, reverse_kl, wasserstein, drift.
# drift is the same KL with beta = coef / (1 + alpha * max(V_drift, 0)).
anchor_dist = kl
anchor_drift_alpha = 0.05

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 1e9
mean = 2e8
scale = auto

[sweep.train.anchor_coef]
distribution = log_normal
min = 0.00001
max = 0.5
mean = 0.05
scale = auto

; [sweep.env.reward_jerk]
; distribution = uniform
; min = -0.002
; max = 0.0
; scale = auto