[base]
env_name = drive
checkpoint_interval = 500
record_rollout_every = 0
# Clip length in steps. Training episodes stay at episode_length.
record_frames = 200

[vec]
# 128 cars per copy. 8192 / 128 = 64 copies across 4 CARLA maps,
# 16 copies each.
total_agents = 8192
num_buffers = 4
num_threads = 4

[env]
selected_agent_idx = 0
# Single-map tools still load map_id. The trainer, when num_maps > 1,
# gives each copy its own file: map_000 Town01, map_001 Town02,
# map_002 Town06, map_003 Town10HD.
map_id = 0
data_dir = data/mixed
num_maps = 4
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
# Paid on every arrival within 5 m.
reward_goal = 0.734402776
# Tiny velocity-change penalty: reward_jerk * |Δv| / dt each step.
reward_jerk = -0.0003
# Speed reward is Gigaflow's lane-alignment bonus, paid only while
# signed speed is inside the band. km/h. A target of 0 pays nothing.
target_speed = 50
speed_band = 2
# Steps before the episode resets.
episode_length = 256
# Cars placed on one map copy. 128 divides 8192 and each buffer of 4096.
num_agents = 128
# Euclidean goal distance in meters. The point is on the forward
# centerline, in front of the car. 
goal_distance_min = 5
goal_distance_max = 50
# Agent overlap. bump pushes cars apart. through lets them pass.
collision_physics = through

[sweep]
metric = score
metric_distribution = linear
max_suggestion_cost = 3200
init = current
focus = score

[policy]
# Entity encoder: per-token MLP, then 4 latent queries cross-attend
# over ego, every road segment, and every partner. MinGRU is 64 x 4.
hidden_size = 64
num_layers = 4

[train]
total_timesteps = 493_521_376
learning_rate = 0.00259472942
gamma = 0.998478353
gae_lambda = 0.770922899
replay_ratio = 1
clip_coef = 0.433590531
vf_coef = 2.99438667
vf_clip_coef = 1.3014487
max_grad_norm = 1.26761019
ent_coef = 0.000549414777
momentum = 0.972206533
minibatch_size = 8192
horizon = 32
# Spiced self-play.
# 1000 Waymo maps, 982 inputs, steer ±0.5404195. Stopped at within-10
# mean 0.95. The target-speed column is zero.
anchor = checkpoints/bc_womd_1000.npz
anchor_coef = 0.0217380654
# Options: kl, reverse_kl, wasserstein.
anchor_dist = kl

; [sweep.train.total_timesteps]
; distribution = log_normal
; min = 7e8
; max = 2e9
; mean = 5e8
; scale = auto

[sweep.train.anchor_coef]
distribution = log_normal
min = 0.00001
max = 0.2
mean = 0.05
scale = auto

; [sweep.train.horizon]
; distribution = uniform_pow2
; min = 32
; max = 128
; scale = auto

[sweep.env.reward_goal]
distribution = log_normal
min = 0.1
max = 1.0
mean = 0.2
scale = auto