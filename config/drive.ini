[base]
env_name = drive

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
human_agent_idx = 0
map_id = 0
data_dir = data/bottleneck
reward_vehicle_collision = -0.2
reward_offroad_collision = -0.2
# Kept so older sweeps still parse. Every goal pays +1, including after
# a respawn. The step does not read this value.
reward_goal_post_respawn = 0
reward_vehicle_collision_post_respawn = 0
# Cost of one squared bin-step of accel or steer change. One adjacent-bin
# flip per step is 0.001, against a +1 goal.
reward_jerk = -0.001
# One step at the personal max speed pays this. 0 at a stop or at twice
# that speed. 500 steps on the max is +1, the same as one goal.
reward_speed = 0.002
num_maps = 1
# 0 = start from logged trajectories. 1 = structured SUMO-style flows below.
# 1 places the initial vehicles. The learned policy moves them.
agent_initialization = 1

# 1 replays logged actor positions, headings, velocities, and validity exactly.
# Policy actions, collisions, goals, and respawns are bypassed. Requires
# agent_initialization = 0.
replay_logged_agents = 0

# Steps before the episode resets. Each step is 0.1 s, so 500 is 50 s.
# Exact replay instead uses the logged ego's stored trajectory length.
episode_length = 500

# Used when agent_initialization = 1. Numbered keys start at 0 with no gaps.
# vtype_N = id,length,width,height,maxSpeed
# route_N = id,edge,edge,...
# flow_N  = id,type,begin,end,vehsPerHour,route,departLane,departSpeed
# departLane: random, free, best, first, allowed, or a lane index.
# departSpeed: desired, max, speedLimit, or a speed in m/s.
# Vehicles still on each route at time end are placed in free flow.
# Width and height are SUMO defaults; the hdv type sets length and maxSpeed.
network_file = data/bottleneck/onramp.net.xml
# Placeholder used only while placing the initial vehicles. Each episode
# reset samples a goal on that vehicle's route, from 40 m past its spawn
# out to the end of the route.
flow_goal_distance = 150
vtype_0 = hdv,4.3,1.8,1.5,55.56
# Each reset draws one uniform target per car from target_speed_min
# to target_speed_max. The car starts at that speed. The viewer Min
# and Max sliders edit the same numbers.
target_speed_min = 20.0
target_speed_max = 80.0
route_0 = mainlane,E0,E1,E2,E4
route_1 = ramp,ramp,E2,E4
flow_0 = mainlane,hdv,0,300,5000,mainlane,random,desired
flow_1 = ramp_0,hdv,0,300,1000,ramp,random,desired

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 1000000000
learning_rate = 0.001
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.005
momentum = 0.95
minibatch_size = 8192
horizon = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 1e9
scale = auto
 
[sweep.env.reward_vehicle_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto 
 
[sweep.env.reward_offroad_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto

# Unused by the step. Every goal pays +1.
[sweep.env.reward_goal_post_respawn]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto
