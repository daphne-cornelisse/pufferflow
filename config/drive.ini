[base]
env_name = drive

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
selected_agent_idx = 0
map_id = 0
data_dir = data/bottleneck
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
# Paid on every arrival within 2 m.
reward_goal = 1.0
# Cost of one squared bin-step of accel or steer change.
reward_jerk = -0.0
# Steps before the episode resets. Each step is 0.1 s, so 500 is 50 s.
episode_length = 500
# Cars placed on this map. total_agents must divide by this number.
num_agents = 64
# Straight-line goal distance in meters. The lane point is in front.
goal_distance_min = 10
goal_distance_max = 50
# Agent overlap. bump pushes cars apart. through lets them pass.
collision_physics = bump

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 1000000000
learning_rate = 0.001
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.005
momentum = 0.95
minibatch_size = 8192
horizon = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 1e9
scale = auto
 
