[base]
env_name = drive

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
selected_agent_idx = 0
map_id = 0
data_dir = data/bottleneck
reward_vehicle_collision = -0.2
reward_offroad_collision = -0.2
# Paid on every arrival within 1 m.
reward_goal = 1
# Cost of one squared bin-step of accel or steer change. One adjacent-bin
# flip per step is 0.001, against a +1 goal.
reward_jerk = -0.001
# Steps before the episode resets. Each step is 0.1 s, so 500 is 50 s.
episode_length = 500
# Cars placed on this map. total_agents must divide by this number.
num_agents = 64
# Straight-line goal distance in meters. The lane point is in front.
goal_distance_min = 20
goal_distance_max = 100

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 1000000000
learning_rate = 0.001
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.005
momentum = 0.95
minibatch_size = 8192
horizon = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 3e9
mean = 1e9
scale = auto
 
[sweep.env.reward_vehicle_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto 
 
[sweep.env.reward_offroad_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto

[sweep.env.reward_goal]
distribution = uniform
min = 0.0
max = 2.0
mean = 1.0
scale = auto
