[base]
env_name = drive

[vec]
total_agents = 8192
num_buffers = 2
# Workers per buffer are num_threads / num_buffers. 16 keeps the env step
# on several cores; the GPU train step was leaving those cores idle.
num_threads = 16

[env]
human_agent_idx = 0
map_id = 0
reward_vehicle_collision = -0.2
reward_offroad_collision = -0.2
reward_goal_post_respawn = 0
reward_vehicle_collision_post_respawn = 0
num_maps = 500
map_dir = data/drive/binaries
# 0 keeps one packed batch. PufferDrive trains at 910 steps (10 episodes).
resample_frequency = 0
resample_seed = 73
# Second scenario catalog, mixed into the same batch. "none" uses map_dir only.
# Waymo and CARLA binaries share one layout. Episodes stay 91 steps.
extra_map_dir = none
extra_num_maps = 0

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 1667760009
learning_rate = 0.001
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.005
momentum = 0.95
minibatch_size = 8192
horizon = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 5e8
mean = 3e8
scale = auto
 
[sweep.env.reward_vehicle_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto 
 
[sweep.env.reward_offroad_collision]
distribution = uniform
min = -1.0
max = 0.0
mean = -0.2
scale = auto

[sweep.env.reward_goal_post_respawn]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = auto

# These replace the default.ini ranges. The drive encoder at hidden 256,
# 8192 agents, and horizon 128 already uses about 8.5 GB, so wider nets,
# longer horizons, and larger fleets do not fit this 16 GB GPU.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 64
max = 256
scale = auto

[sweep.policy.num_layers]
distribution = uniform
min = 1
max = 4
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 8192
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 4096
max = 8192
scale = auto
