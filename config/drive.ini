[base]
env_name = drive
checkpoint_interval = 500
record_rollout_every = 0
# Clip length in steps. Training episodes stay at episode_length.
record_frames = 200

[vec]
# 128 cars per copy. 8192 / 128 = 64 copies across 5 maps.
total_agents = 8192
num_buffers = 2
num_threads = 4

[env]
selected_agent_idx = 0
# Single-map tools still load map_id. The trainer, when num_maps > 1,
# gives each copy its own file: map_000 Town01, map_001 Town02,
# map_002 Town06, map_003 Town10HD, map_004 bottleneck.
map_id = 0
data_dir = data/mixed
num_maps = 5
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
# Paid on every arrival within 5 m.
reward_goal = 0.658449829
# Tiny velocity-change penalty: reward_jerk * |Δv| / dt each step.
reward_jerk = -0.0003
# Speed reward is Gigaflow's lane-alignment bonus, paid only while
# signed speed is inside the band. km/h. A target of 0 pays nothing.
target_speed = 50
speed_band = 2
# Steps before the episode resets.
episode_length = 256
# Cars placed on one map copy. 128 divides 8192 and each buffer of 4096.
num_agents = 128
# Share of copies marked hard after 50M steps. Swept in [0, 0.8].
# The other copies stay on these ini settings (standard eval).
hard_frac = 0.29803285
# Euclidean goal distance in meters. The point is on the forward
# centerline, in front of the car. 
goal_distance_min = 5
goal_distance_max = 50
# Agent overlap. bump pushes cars apart. through lets them pass.
collision_physics = through

[sweep]
metric = standard_score
metric_distribution = linear
# Seconds. Long enough for a multi-hundred-million-step trial.
max_suggestion_cost = 14400
use_history = 1
# Finished trials from another folder. Empty reads only this log dir.
history_dir =

[policy]
# Entity encoder: per-token MLP with SiLU, then 4 latent queries.
# The MLP output is the key and the value. Empty slots are masked.
# MinGRU is 64 x 2.
hidden_size = 64
num_layers = 2

[train]
total_timesteps = 164559120
learning_rate = 0.0499999821
gamma = 0.981724501
gae_lambda = 0.995000005
replay_ratio = 1
clip_coef = 0.815517008
vf_coef = 1.07702088
vf_clip_coef = 1.3351723
max_grad_norm = 0.100000001
ent_coef = 0.000278633321
momentum = 0.5
minibatch_size = 32768
horizon = 32
# Episode-step bins, advantage histograms, and per-sample gradient
# norms, in train iterations. 0 turns all three off. Capture of the
# train graph skips the gradient pass on that iteration.
advantage_every = 250
# Spiced self-play.
# 1000 Waymo maps, 982 inputs, steer ±0.5404195. Stopped at within-10
# mean 0.95. The target-speed column is zero.
anchor = #checkpoints/bc_womd_1000.npz
anchor_coef = 0.2
# Options: kl, reverse_kl, wasserstein.
anchor_dist = kl

# Up to 2 billion steps. The operating budget above is the short default.
[sweep.train.total_timesteps]
distribution = log_normal
min = 1e8
max = 2e9
scale = time

[sweep.train.anchor_coef]
distribution = log_normal
min = 0.01
max = 0.2
mean = 0.05
scale = auto

[sweep.env.reward_goal]
distribution = log_normal
min = 0.1
max = 1.0
mean = 0.2
scale = auto

[sweep.env.hard_frac]
distribution = uniform
min = 0.0
max = 0.8
scale = auto