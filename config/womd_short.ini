# Waymo 1000-map self-play. Scenes are the logged 9.1 s (91 frames).
# A car is removed when it reaches its logged goal. The episode ends
# when every spawned car has arrived, or at 91 steps.
# Eight slots per copy. 8192 / 8 = 1024 copies, so each map is loaded.

[base]
env_name = drive
checkpoint_interval = 500
record_rollout_every = 0
record_frames = 200
log_dir = logs/womd
checkpoint_dir = checkpoints/womd

[vec]
total_agents = 8192
num_buffers = 4
num_threads = 8

[env]
selected_agent_idx = 0
map_id = 0
data_dir = data/womd_train_1000
num_maps = 1000
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
reward_goal = 1.0
reward_jerk = 0
target_speed = 0
speed_band = 2
episode_length = 91
num_agents = 8
# control_vehicles, control_agents, control_wosac, control_sdc_only,
# control_mixed_play. control_agents is the PufferDrive default.
control_mode = control_agents
max_controlled_agents = 32
goal_distance_min = 5
goal_distance_max = 50
# Training reads frame 0, arrives inside 5 m, and removes the car.
# WOSAC eval overrides these: init 10, radius 2, stop, full horizon.
# Human-replay overrides length 110, radius 2.5, control_sdc_only.
init_steps = 0
goal_radius = 5
goal_speed = 100
goal_stop = 0
wosac_dir = none
map_offset = 0

[policy]
hidden_size = 64
num_layers = 4

[sweep]
metric = score
metric_distribution = linear
max_suggestion_cost = 3200
use_history = 0

[train]
total_timesteps = 500_000_000
learning_rate = 0.003
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
momentum = 0.95
minibatch_size = 8192
horizon = 32
anchor = checkpoints/bc_womd_1000.npz
anchor_coef = 0.0217380654
anchor_dist = kl

[sweep.train.total_timesteps]
distribution = log_normal
min = 5e8
max = 2e9
mean = 5e8
scale = auto

# Uniform so a coefficient of 0 is inside the range.
[sweep.train.anchor_coef]
distribution = uniform
min = 0.0
max = 0.2
scale = auto