# I24 self-play. Three logs, one per scene. Cars spawn on the logged
# frame-0 pose and drive to that track's last logged position.
# Scene lengths are 242, 604, and 625 states. Scene 1 drops
# samples after 90 s on the file clock. The horizon below is
# the longest. A shorter log ends at its own last frame.
# A car is removed when it reaches its logged goal. The episode ends
# when every spawned car has arrived, or at that horizon.
# 128 slots per copy. 8192 / 128 = 64 copies across the 3 maps.
# A track valid at frame 0 is a policy car. A track that is invalid
# then follows the log on frames where its valid flag is set, and
# is absent otherwise. It does not react.
# The player opens map 0. New scene cycles map 0, 1, and 2.
# Follow starts on a car. Turning it off frames the whole roadway.
#   ./drive --config=config/i24.ini

[base]
env_name = drive
checkpoint_interval = 500
record_rollout_every = 0
record_frames = 200
log_dir = logs/i24
checkpoint_dir = checkpoints/i24

[vec]
total_agents = 8192
num_buffers = 4
num_threads = 8

[env]
selected_agent_idx = 0
map_id = 0
data_dir = data/i24
num_maps = 3
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
reward_goal = 1.0
reward_jerk = 0
target_speed = 0
speed_band = 2
episode_length = 625
num_agents = 128
# control_vehicles, control_agents, control_wosac, control_sdc_only,
# control_mixed_play. control_agents is the PufferDrive default.
control_mode = control_agents
max_controlled_agents = 32
goal_distance_min = 5
goal_distance_max = 50
# Training reads frame 0, arrives inside 5 m, and removes the car.
init_steps = 0
goal_radius = 5
goal_speed = 100
goal_stop = 0
wosac_dir = none
map_offset = 0

[policy]
hidden_size = 64
num_layers = 4

[train]
total_timesteps = 500_000_000
learning_rate = 0.003
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.0
ent_coef = 0.001
momentum = 0.95
minibatch_size = 8192
horizon = 32
# Loaded even when anchor_coef is 0, so loss/anchor still logs.
# An empty path leaves the anchor off. anchor_dist is read even then.
anchor = analysis/offline/i24/bc_3.npz
anchor_coef = 0
anchor_dist = kl

# Overlay on config/default.ini. The other [sweep.*] ranges stay.
# 500M is the [train] default, so the timestep minimum is 500M.
[sweep.train.total_timesteps]
min = 5e8
max = 2e9

# Same range as config/womd_short.ini. Uniform so 0 is inside it.
[sweep.train.anchor_coef]
distribution = uniform
min = 0.0
max = 0.2
scale = auto
