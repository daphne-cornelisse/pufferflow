# Sweep base is the run-28 config, the best 1B anchor result (score 0.912).
# num_layers is the integer the trainer used. Sweep ranges match the
# previous I24 sweep: default.ini parameters, timesteps 500M–2B, and
# the WOMD anchor-coefficient range.

[base]
env_name = drive
checkpoint_interval = 500
record_rollout_every = 0
record_frames = 200
log_dir = logs/i24_sweep_best
checkpoint_dir = checkpoints/i24_sweep_best
seed = 73

[vec]
total_agents = 8192
num_buffers = 4
num_threads = 8

[env]
selected_agent_idx = 0
map_id = 0
data_dir = data/i24
num_maps = 3
reward_vehicle_collision = -1.0
reward_offroad_collision = -1.0
reward_goal = 1.0
reward_jerk = 0
target_speed = 0
speed_band = 2
episode_length = 625
num_agents = 128
control_mode = control_agents
max_controlled_agents = 32
goal_distance_min = 5
goal_distance_max = 50
init_steps = 0
goal_radius = 5
goal_speed = 100
goal_stop = 0
wosac_dir = none
map_offset = 0

[policy]
hidden_size = 128
num_layers = 1

[train]
total_timesteps = 1_000_000_000
learning_rate = 0.00116539211
gamma = 0.999628186
gae_lambda = 0.875635743
replay_ratio = 1
clip_coef = 0.8548491
vf_coef = 1.48771489
vf_clip_coef = 0.560207248
max_grad_norm = 1.4774158
ent_coef = 2.93883641e-05
momentum = 0.959175348
minibatch_size = 32768
horizon = 64
anchor = analysis/offline/i24/bc_3.npz
anchor_coef = 0.0681012049
anchor_dist = kl

[sweep]
use_history = 0

[sweep.train.total_timesteps]
min = 5e8
max = 2e9

[sweep.train.anchor_coef]
distribution = uniform
min = 0.0
max = 0.2
scale = auto
