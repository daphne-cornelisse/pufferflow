# I24 highway realism. Histogram bins match eval/wosac/wosac.ini (WOSAC 2024).
# Collision indication and off-road indication are not scored.
# There is no metametric weight. Eta is the unweighted mean of these seven.

[linear_speed]
histogram.min_val = 0.0
histogram.max_val = 25.0
histogram.num_bins = 10
histogram.additive_smoothing_pseudocount = 0.1
independent_timesteps = true

[linear_acceleration]
histogram.min_val = -12.0
histogram.max_val = 12.0
