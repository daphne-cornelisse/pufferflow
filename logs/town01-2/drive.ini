[base]
env_name = drive
checkpoint_interval = 1000
record_rollout_every = 1
# Clip length in steps. Training episodes stay at episode_length.
record_frames = 200

[vec]
total_agents = 8192
num_buffers = 2
num_threads = 2

[env]
selected_agent_idx = 0
map_id = 0
data_dir = data/carla
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
# Paid on every arrival within 5 m.
reward_goal = 1.0
# Tiny velocity-change penalty: reward_jerk * |Δv| / dt each step.
reward_jerk = -0.0002
# Steps before the episode resets.
episode_length = 500
# Cars placed on this map. total_agents must divide by this number.
num_agents = 128
# Euclidean goal distance in meters. The point is on the forward
# centerline, in front of the car. 
goal_distance_min = 5
goal_distance_max = 30
# Agent overlap. bump pushes cars apart. through lets them pass.
collision_physics = through

[sweep]
metric = score
metric_distribution = linear
max_suggestion_cost = 1200

[policy]
hidden_size = 256
num_layers = 4

[train]
total_timesteps = 5e8
learning_rate = 0.001
gamma = 0.98
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 2
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.005
momentum = 0.95
minibatch_size = 8192
horizon = 128

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e8
max = 1e9
mean = 2e8
scale = auto
 
; [sweep.env.reward_jerk]
; distribution = uniform
; min = -0.002
; max = 0.0
; scale = auto